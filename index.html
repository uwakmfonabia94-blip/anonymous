<div id="app" class="app-shell">
  <header class="app-header">
    <a class="brand" href="/">
      <span class="brand__dot" aria-hidden="true"></span>
      <span class="brand__name">Anonymous</span>
    </a>
    <button class="btn btn--ghost btn--sm" data-action="join" type="button" id="header-join">Join</button>
  </header>

  <main id="view-root" class="view-root"></main>

  <nav class="bottom-nav" aria-label="Primary">
    <a class="bottom-nav__item" href="/" data-route="home">
      <svg class="icon icon--24"><use href="#i-home"/></svg><span>Home</span>
    </a>
    <a class="bottom-nav__item" href="/activity" data-route="activity">
      <svg class="icon icon--24"><use href="#i-bell"/></svg><span>Activity</span>
      <span class="bottom-nav__badge" id="nav-badge" hidden></span>
    </a>
    <button class="bottom-nav__compose" aria-label="Compose" data-action="compose" type="button">
      <svg class="icon icon--24"><use href="#i-plus"/></svg>
    </button>
    <a class="bottom-nav__item" href="/discover" data-route="discover">
      <svg class="icon icon--24"><use href="#i-compass"/></svg><span>Discover</span>
    </a>
    <a class="bottom-nav__item" href="/me" data-route="me">
      <svg class="icon icon--24"><use href="#i-user"/></svg><span>Me</span>
    </a>
  </nav>
</div>

<!-- TEMPLATES -->

<template id="tpl-feed-screen">
  <div class="screen screen--feed">
    <section class="pin-banner">
      <span class="pin-banner__label">Today</span>
      <p class="pin-banner__text">What are you curious about that yo can say in public say it here...?</p>
    </section>
    <div class="feed-list" data-role="feed"></div>
    <div data-role="sentinel" style="height:1px"></div>
  </div>
</template>

<template id="tpl-post-card">
  <article class="post-card" data-post-id="">
    <header class="post-card__header">
      <span class="avatar" aria-hidden="true"></span>
      <div class="post-card__meta">
        <span class="post-card__alias"></span>
        <span class="post-card__dot">·</span>
        <span class="post-card__time"></span>
        <span class="post-card__dot post-card__category-dot" hidden>·</span>
        <span class="post-card__category" hidden></span>
      </div>
      <button class="post-card__menu" data-action="more" aria-label="More options">
        <svg class="icon icon--18"><use href="#i-more"/></svg>
      </button>
    </header>
    <p class="post-card__body"></p>
    <div class="post-card__teaser" hidden>
      <span class="post-card__teaser__author"></span>
      <span class="post-card__teaser__text"></span>
    </div>
    <div class="post-card__stats" hidden>
      <svg class="icon icon--14 post-card__reach-icon"><use href="#i-eye"/></svg>
      <span class="post-card__reach">0</span>
    </div>
    <footer class="post-card__actions">
      <button class="post-card__action" data-action="vote" aria-label="Like">
        <svg class="icon icon--18"><use href="#i-heart"/></svg><span class="post-card__count">0</span>
      </button>
      <button class="post-card__action" data-action="open" aria-label="Comments">
        <svg class="icon icon--18"><use href="#i-message"/></svg><span class="post-card__count">0</span>
      </button>
      <button class="post-card__action post-card__action--whatsapp" data-action="share-whatsapp" aria-label="Share to WhatsApp">
        <svg class="icon icon--18"><use href="#i-whatsapp"/></svg>
      </button>
      <button class="post-card__action" data-action="share" aria-label="Share">
        <svg class="icon icon--18"><use href="#i-share"/></svg>
      </button>
    </footer>
  </article>
</template>

    <header class="post-card__header">

    <div class="post-card__teaser" hidden>

    </div>
    <div class="post-card__stats" hidden>
      <svg class="icon icon--14 post-card__reach-icon"><use href="#i-eye"/></svg>

      <button class="post-card__action post-card__action--whatsapp" data-action="share-whatsapp" aria-label="Share to WhatsApp">

      <button class="post-card__action" data-action="share" aria-label="Share">

<template id="tpl-poll-card">
  <article class="post-card post-card--poll" data-post-id="">

<template id="tpl-poll-option-vote">
  <button class="poll-option poll-option--vote" type="button">
    <span class="poll-option__radio"></span>
    <span class="poll-option__label"></span>
  </button>
</template>

<template id="tpl-poll-option-result">
  <div class="poll-option poll-option--result">
    <span class="poll-option__fill"></span>
    <span class="poll-option__label"></span>
    <span class="poll-option__percent"></span>
  </div>
</template>

<template id="tpl-poll-option-input">
  <div class="poll-editor__row">
    <input class="poll-editor__input" type="text" maxlength="80" placeholder="">
    <button class="poll-editor__remove" type="button" aria-label="Remove">
      <svg class="icon icon--18"><use href="#i-x"/></svg>
    </button>
  </div>
</template>

<template id="tpl-spice-card">
  <article class="spice-card">
    <div class="spice-card__badge">
      <svg class="icon icon--14"><use href="#i-sparkles"/></svg>
      <span class="spice-card__badge-text"></span>
    </div>
    <p class="spice-card__text"></p>
    <button class="btn btn--ghost btn--sm spice-card__cta" type="button">
      <svg class="icon icon--14"><use href="#i-plus"/></svg>
      <span>Post about this</span>
    </button>
  </article>
</template>

<template id="tpl-section-header">
  <div class="section-header"></div>
</template>

<template id="tpl-new-posts-bar">
  <button class="new-posts-bar" type="button">
    <svg class="icon icon--14"><use href="#i-arrow-up"/></svg>
    <span class="new-posts-bar__text">New posts</span>
  </button>
</template>

<template id="tpl-recap-modal">
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="sheet__handle"></div>
    <header class="sheet__header">
      <h2 class="sheet__title">While you were away</h2>
    </header>
    <div class="sheet__body">
      <ul class="recap-list">
        <li class="recap-item" data-role="replies">
          <span class="recap-item__icon recap-item__icon--replies">
            <svg class="icon icon--20"><use href="#i-message"/></svg>
          </span>
          <div class="recap-item__body">
            <strong class="recap-item__count">0</strong>
            <span class="recap-item__label">new replies</span>
          </div>
        </li>
        <li class="recap-item" data-role="upvotes">
          <span class="recap-item__icon recap-item__icon--upvotes">
            <svg class="icon icon--20"><use href="#i-heart"/></svg>
          </span>
          <div class="recap-item__body">
            <strong class="recap-item__count">0</strong>
            <span class="recap-item__label">new likes</span>
          </div>
        </li>
        <li class="recap-item" data-role="posts">
          <span class="recap-item__icon recap-item__icon--posts">
            <svg class="icon icon--20"><use href="#i-flame"/></svg>
          </span>
          <div class="recap-item__body">
            <strong class="recap-item__count">0</strong>
            <span class="recap-item__label">new posts on campus</span>
          </div>
        </li>
      </ul>
      <button class="btn btn--primary btn--block" data-action="dismiss">See what's new</button>
    </div>
  </div>
</template>

<template id="tpl-post-detail">
  <div class="screen screen--post">
    <div class="screen__header">
      <button class="btn btn--ghost btn--icon" data-action="back" aria-label="Back">
        <svg class="icon icon--24"><use href="#i-arrow-left"/></svg>
      </button>
    </div>
    <div data-role="post"></div>
    <section class="comments">
      <h2 class="comments__heading" data-role="comments-heading">Comments</h2>
      <div class="comments__list" data-role="comments"></div>
    </section>
    <form class="reply-bar" data-role="reply-form">
      <input class="reply-bar__input" type="text" placeholder="Reply anonymously…" maxlength="300" data-role="reply-input">
      <button class="reply-bar__send btn btn--primary btn--icon" type="submit" aria-label="Send">
        <svg class="icon icon--20"><use href="#i-arrow-left"/></svg>
      </button>
    </form>
  </div>
</template>

<template id="tpl-comment">
  <article class="comment">
    <header class="comment__header">
      <span class="avatar avatar--sm" aria-hidden="true"></span>
      <span class="comment__alias"></span>
      <span class="comment__time"></span>
    </header>
    <p class="comment__body"></p>
    <button class="comment__reply" data-action="reply">Reply</button>
    <div class="comment__replies" data-role="replies"></div>
  </article>
</template>

<template id="tpl-compose">
  <div class="compose">
    <header class="compose__header">
      <button class="btn btn--ghost btn--icon" data-action="close" aria-label="Close">
        <svg class="icon icon--24"><use href="#i-x"/></svg>
      </button>
      <button class="btn btn--primary btn--sm" data-action="submit" disabled>Post</button>
    </header>
    <div class="compose__tabs">
      <button type="button" class="compose__tab is-active" data-mode="text">Text</button>
      <button type="button" class="compose__tab" data-mode="poll">Poll</button>
    </div>
    <div class="compose__body" data-role="text-mode">
      <textarea class="compose__textarea" placeholder="What's on your mind?" maxlength="300" rows="8" data-role="textarea"></textarea>
      <div class="compose__counter"><span data-role="counter">0</span>/300</div>
    </div>
    <div class="compose__body" data-role="poll-mode" hidden>
      <textarea class="compose__textarea compose__textarea--question" placeholder="Ask a question…" maxlength="300" rows="2" data-role="question"></textarea>
      <div class="compose__counter"><span data-role="q-counter">0</span>/300</div>
      <div class="poll-editor" data-role="options"></div>
      <button type="button" class="btn btn--ghost btn--sm poll-editor__add" data-action="add-option">
        <svg class="icon icon--14"><use href="#i-plus"/></svg>
        Add option
      </button>
    </div>
    <div class="compose__chips" data-role="chips">
      <button type="button" class="chip" data-cat="Confession">#Confession</button>
      <button type="button" class="chip" data-cat="Question">#Question</button>
      <button type="button" class="chip" data-cat="CampusLife">#CampusLife</button>
      <button type="button" class="chip" data-cat="Rant">#Rant</button>
      <button type="button" class="chip" data-cat="Wholesome">#Wholesome</button>
    </div>
    <label class="checkbox compose__shareable" data-role="shareable-wrap">
      <input type="checkbox" checked data-role="shareable">
      <span>Allow link previews</span>
    </label>
    <p class="compose__footnote">Posting means you've read the <a href="/guidelines" target="_blank" rel="noopener">Community Guidelines</a>.</p>
  </div>
</template>

<template id="tpl-activity">
  <div class="screen screen--activity">
    <header class="page-header"><h1 class="page-header__title">Activity</h1></header>
    <div class="activity-tabs">
      <button type="button" class="activity-tab is-active" data-filter="all">All</button>
      <button type="button" class="activity-tab" data-filter="replies">Replies</button>
      <button type="button" class="activity-tab" data-filter="likes">Likes</button>
    </div>
    <ul class="activity-list" data-role="list"></ul>
    <div class="activity-mark-read" data-role="mark-read-bar" hidden>
      <button class="btn btn--primary btn--block" data-action="mark-read" type="button">
        Mark all as read · <span data-role="unread-count">0</span>
      </button>
    </div>
  </div>
</template>

<template id="tpl-activity-item">
  <li class="activity-item">
    <span class="activity-item__icon">
      <svg class="icon icon--20"><use href="#i-bell"/></svg>
    </span>
    <div class="activity-item__body">
      <p class="activity-item__title"></p>
      <p class="activity-item__excerpt"></p>
      <span class="activity-item__time"></span>
      <button class="activity-item__reply-btn" data-action="reply-back" type="button">
        <svg class="icon icon--14"><use href="#i-arrow-left"/></svg>
        Reply back
      </button>
    </div>
  </li>
</template>

<template id="tpl-me">
  <div class="screen screen--me">
    <header class="page-header"><h1 class="page-header__title">You</h1></header>

    <section class="me-screen__identity">
      <span class="avatar avatar--lg" aria-hidden="true" data-role="avatar"></span>
      <h2 class="me-screen__alias" data-role="alias"></h2>
      <p class="me-screen__since" data-role="since"></p>
      <button class="btn btn--ghost btn--sm" data-action="rename" data-role="rename">
        <svg class="icon icon--18"><use href="#i-refresh"/></svg>
        Change name
      </button>
    </section>

    <section class="me-weekly" data-role="weekly" hidden>
      <h3 class="me-section-title">
        <svg class="icon icon--14"><use href="#i-trending-up"/></svg>
        This week
      </h3>
      <div class="me-weekly__grid">
        <div class="me-weekly__stat"><strong data-role="weekly-posts">0</strong><span>posts</span></div>
        <div class="me-weekly__stat"><strong data-role="weekly-likes">0</strong><span>likes</span></div>
        <div class="me-weekly__stat"><strong data-role="weekly-reach">0</strong><span>reach</span></div>
      </div>
    </section>

    <section class="me-best-post" data-role="best-post" hidden>
      <h3 class="me-section-title">
        <svg class="icon icon--14"><use href="#i-award"/></svg>
        Your best post
      </h3>
      <button class="me-best-post__card" data-role="best-post-card" type="button">
        <p class="me-best-post__quote" data-role="best-post-quote"></p>
        <div class="me-best-post__meta">
          <span><svg class="icon icon--14"><use href="#i-heart"/></svg><span data-role="best-post-likes">0</span></span>
          <span><svg class="icon icon--14"><use href="#i-message"/></svg><span data-role="best-post-comments">0</span></span>
          <span><svg class="icon icon--14"><use href="#i-eye"/></svg><span data-role="best-post-reach">0</span></span>
        </div>
      </button>
    </section>

    <section class="me-campus-goal" data-role="campus-goal" hidden>
      <h3 class="me-section-title">
        <svg class="icon icon--14"><use href="#i-target"/></svg>
        Campus goal
      </h3>
      <div class="me-campus-goal__card">
        <div class="me-campus-goal__text">
          <span data-role="goal-joined">0</span>
          <span class="me-campus-goal__sep">/</span>
          <span data-role="goal-target">500</span>
          <span class="me-campus-goal__label">joined</span>
        </div>
        <div class="me-campus-goal__bar">
          <div class="me-campus-goal__fill" data-role="goal-fill" style="width: 0%"></div>
        </div>
        <button class="btn btn--ghost btn--sm me-campus-goal__share" data-action="share-app">
          <svg class="icon icon--14"><use href="#i-whatsapp"/></svg>
          Invite a friend
        </button>
      </div>
    </section>

    <section class="me-milestones" data-role="milestones" hidden>
      <h3 class="me-section-title">
        <svg class="icon icon--14"><use href="#i-award"/></svg>
        Milestones
      </h3>
      <ul class="me-milestones__list" data-role="milestones-list"></ul>
    </section>

    <details class="me-settings">
      <summary class="me-settings__summary">
        <svg class="icon icon--18"><use href="#i-settings"/></svg>
        <span>Settings</span>
        <svg class="icon icon--18 me-settings__chevron"><use href="#i-chevron-down"/></svg>
      </summary>
      <ul class="me-screen__list">
        <li><a class="me-screen__item" href="/faq"><span>FAQ</span><svg class="icon icon--18"><use href="#i-chevron-right"/></svg></a></li>
        <li><a class="me-screen__item" href="/guidelines"><span>Community Guidelines</span><svg class="icon icon--18"><use href="#i-chevron-right"/></svg></a></li>
        <li><a class="me-screen__item" href="/privacy"><span>Privacy Policy</span><svg class="icon icon--18"><use href="#i-chevron-right"/></svg></a></li>
        <li><button class="me-screen__item" data-action="notifications"><span>Notifications</span><span data-role="notif-state">Off</span></button></li>
        <li><button class="me-screen__item" data-action="logout"><span>Log out</span><svg class="icon icon--18"><use href="#i-logout"/></svg></button></li>
        <li><button class="me-screen__item me-screen__item--danger" data-action="delete"><span>Delete account</span><svg class="icon icon--18"><use href="#i-trash"/></svg></button></li>
      </ul>
    </details>

    <p class="me-screen__version">v0.2 · built by Anonymous user</p>
  </div>
</template>

<template id="tpl-milestone-item">
  <li class="milestone">
    <span class="milestone__dot"><svg class="icon icon--14"><use href="#i-check"/></svg></span>
    <span class="milestone__label"></span>
    <span class="milestone__progress"></span>
  </li>
</template>

<template id="tpl-discover">
  <div class="screen screen--discover">
    <header class="page-header"><h1 class="page-header__title">Discover</h1></header>
    <div class="compose__chips" data-role="chips">
      <button type="button" class="chip chip--active" data-cat="">All</button>
      <button type="button" class="chip" data-cat="Confession">#Confession</button>
      <button type="button" class="chip" data-cat="Question">#Question</button>
      <button type="button" class="chip" data-cat="CampusLife">#CampusLife</button>
      <button type="button" class="chip" data-cat="Rant">#Rant</button>
      <button type="button" class="chip" data-cat="Wholesome">#Wholesome</button>
    </div>
    <div class="feed-list" data-role="feed"></div>
  </div>
</template>

<template id="tpl-faq">
  <div class="screen screen--page">
    <header class="page-header">
      <button class="btn btn--ghost btn--icon" data-action="back" aria-label="Back">
        <svg class="icon icon--24"><use href="#i-arrow-left"/></svg>
      </button>
      <h1 class="page-header__title">FAQ</h1>
    </header>
    <div class="page-body">
      <h2>What is Anonymous?</h2>
      <p>A private space for your campus to post and reply without names. Nothing you share is tied to your public identity.</p>
      <h2>Is it really anonymous?</h2>
      <p>Yes, to everyone on the platform. You pick a display name when you join, and that's the only thing other people see. The only place your email exists is in our private admin tools, used only for moderation.</p>
      <h2>How do I join?</h2>
      <p>You need the campus code — CAMPUS-ONE. Ask anyone who's already in, or look at your invite card.</p>
      <h2>Can I change my name?</h2>
      <p>Once per day. Your new name applies to all your posts and replies.</p>
      <h2>Can I delete my post?</h2>
      <p>Yes. Tap the ⋯ on your own post and choose Delete.</p>
      <h2>Can I delete my account?</h2>
      <p>Yes. Go to Me → Delete account. Your email and profile are removed, and your posts and replies are shown as [deleted].</p>
      <h2>What isn't allowed?</h2>
      <p>Anything that targets a real person with the intent to harm. See the <a href="/guidelines">Community Guidelines</a>.</p>
      <h2>How do I report something?</h2>
      <p>Tap the ⋯ on any post or comment, then choose Report.</p>
    </div>
  </div>
</template>

<template id="tpl-empty">
  <div class="empty-state">
    <span class="empty-state__icon"><svg class="icon icon--32"><use href="#i-message"/></svg></span>
    <h2 class="empty-state__title">It's quiet in here</h2>
    <p class="empty-state__text">Be the first to say something.</p>
    <button class="btn btn--primary" data-action="compose" type="button">Post anonymously</button>
  </div>
</template>

<template id="tpl-skeleton-card">
  <div class="skeleton-card" aria-hidden="true">
    <div class="skeleton-card__header">
      <span class="skeleton skeleton--avatar"></span>
      <div class="skeleton-card__meta">
        <span class="skeleton skeleton--line" style="width:40%"></span>
        <span class="skeleton skeleton--line" style="width:20%"></span>
      </div>
    </div>
    <span class="skeleton skeleton--line" style="width:95%"></span>
    <span class="skeleton skeleton--line" style="width:80%"></span>
    <span class="skeleton skeleton--line" style="width:60%"></span>
  </div>
</template>

<template id="tpl-soft-wall">
  <section class="soft-wall">
    <h2 class="soft-wall__title">You've seen enough.</h2>
    <p class="soft-wall__text">Join to keep reading and reply anonymously.</p>
    <button class="btn btn--primary btn--block" data-action="join" type="button">Join — takes 15 seconds</button>
  </section>
</template>

<template id="tpl-signup-sheet">
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="sheet__handle"></div>
    <header class="sheet__header">
      <h2 class="sheet__title">Join Anonymous</h2>
      <p class="sheet__subtitle">Say it. Nobody knows.</p>
    </header>
    <form class="sheet__body" data-role="form">
      <div class="field">
        <label class="field__label" for="su-alias">Your name</label>
        <input class="field__input" id="su-alias" type="text" autocomplete="off" required minlength="2" maxlength="24" data-role="alias" placeholder="Pick something like Quiet Comet">
      </div>
      <div class="field">
        <label class="field__label" for="su-email">Email</label>
        <input class="field__input" id="su-email" type="email" autocomplete="email" required data-role="email">
      </div>
      <div class="field">
        <label class="field__label" for="su-password">Password</label>
        <div class="field__group">
          <input class="field__input" id="su-password" type="password" autocomplete="new-password" required minlength="8" data-role="password">
          <button type="button" class="field__toggle" aria-label="Show password" data-action="toggle-password">
            <svg class="icon icon--18"><use href="#i-eye"/></svg>
          </button>
        </div>
      </div>
      <div class="field">
        <label class="field__label" for="su-invite">Campus code</label>
        <input class="field__input" id="su-invite" type="text" autocomplete="off" required data-role="invite" placeholder="Invite code here...">
      </div>
      <label class="checkbox">
        <input type="checkbox" data-role="agree">
        <span>I agree to the <a href="/guidelines" target="_blank" rel="noopener">Community Guidelines</a> and <a href="/privacy" target="_blank" rel="noopener">Privacy Policy</a></span>
      </label>
      <button class="btn btn--primary btn--block" type="submit" disabled data-role="submit">Join the Space</button>
      <p class="sheet__footnote">Already have one? <a href="#" data-action="switch-login">Log in</a></p>
    </form>
  </div>
</template>

<template id="tpl-login-sheet">
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="sheet__handle"></div>
    <header class="sheet__header">
      <h2 class="sheet__title">Welcome back</h2>
      <p class="sheet__subtitle">Say it. Nobody knows.</p>
    </header>
    <form class="sheet__body" data-role="form">
      <div class="field">
        <label class="field__label" for="li-email">Email</label>
        <input class="field__input" id="li-email" type="email" autocomplete="email" required data-role="email">
      </div>
      <div class="field">
        <label class="field__label" for="li-password">Password</label>
        <div class="field__group">
          <input class="field__input" id="li-password" type="password" autocomplete="current-password" required data-role="password">
          <button type="button" class="field__toggle" aria-label="Show password" data-action="toggle-password">
            <svg class="icon icon--18"><use href="#i-eye"/></svg>
          </button>
        </div>
      </div>
      <button class="btn btn--primary btn--block" type="submit" data-role="submit">Log in</button>
      <p class="sheet__footnote">New here? <a href="#" data-action="switch-signup">Join the Space</a></p>
    </form>
  </div>
</template>

<template id="tpl-more-sheet">
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="sheet__handle"></div>
    <div class="sheet__body sheet__body--menu">
      <button class="sheet__menu-item" data-action="report">
        <svg class="icon icon--20"><use href="#i-flag"/></svg><span>Report</span>
      </button>
      <button class="sheet__menu-item" data-action="share">
        <svg class="icon icon--20"><use href="#i-share"/></svg><span>Share</span>
      </button>
      <button class="sheet__menu-item sheet__menu-item--danger" data-action="delete" hidden>
        <svg class="icon icon--20"><use href="#i-trash"/></svg><span>Delete</span>
      </button>
      <button class="sheet__menu-item" data-action="cancel">
        <svg class="icon icon--20"><use href="#i-x"/></svg><span>Cancel</span>
      </button>
    </div>
  </div>
</template>

<template id="tpl-report-sheet">
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="sheet__handle"></div>
    <header class="sheet__header">
      <h2 class="sheet__title">Report</h2>
      <p class="sheet__subtitle">What's wrong with this?</p>
    </header>
    <div class="sheet__body sheet__body--menu">
      <button class="sheet__menu-item" data-reason="harassment"><span>Harassment</span></button>
      <button class="sheet__menu-item" data-reason="doxxing"><span>Sharing personal info</span></button>
      <button class="sheet__menu-item" data-reason="threat"><span>Threat or violence</span></button>
      <button class="sheet__menu-item" data-reason="spam"><span>Spam</span></button>
      <button class="sheet__menu-item" data-reason="other"><span>Something else</span></button>
      <button class="sheet__menu-item" data-action="cancel"><span>Cancel</span></button>
    </div>
  </div>
</template>

<template id="tpl-rename-sheet">
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="sheet__handle"></div>
    <header class="sheet__header">
      <h2 class="sheet__title">Change your name</h2>
      <p class="sheet__subtitle">Once per day. Your old posts get renamed too.</p>
    </header>
    <form class="sheet__body" data-role="form">
      <div class="field">
        <label class="field__label" for="rn-alias">New name</label>
        <input class="field__input" id="rn-alias" type="text" required minlength="2" maxlength="24" autocomplete="off" data-role="alias">
      </div>
      <button class="btn btn--primary btn--block" type="submit" data-role="submit">Save</button>
    </form>
  </div>
</template>

<div id="sheet-root"></div>
<div id="toast-root"></div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
